<div class="flex h-dvh bg-gray-50 overflow-hidden">
  <!-- Overlay (mobile only, shown when sidebar is open) -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 z-20 bg-black/40 md:hidden"
      (click)="toggleSidebar()"
    ></div>
  }

  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-30 w-64 shrink-0 transform bg-white border-r border-gray-200 transition-transform duration-200 ease-in-out md:static md:translate-x-0"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.translate-x-0]="sidebarOpen()"
  >
    <div class="flex h-20 items-center gap-2 px-6 border-b border-gray-200">
      <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-white font-semibold">
        $
      </div>
      <span class="text-lg font-semibold text-gray-900">Mis Finanzas</span>
    </div>

    <nav class="flex flex-col gap-1 p-4">
      @for (item of navItems; track item.id) {
        <button
          type="button"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors"
          [class.bg-indigo-50]="activeSection() === item.id"
          [class.text-indigo-700]="activeSection() === item.id"
          [class.text-gray-600]="activeSection() !== item.id"
          [class.hover:bg-gray-100]="activeSection() !== item.id"
          [routerLink]="item.path"
          (click)="selectSection(item.id)"
        >
          @if (item.iconClass) {
            <i class="flex h-5 w-5 shrink-0 items-center justify-center text-base" [class]="item.iconClass" aria-hidden="true"></i>
          } @else {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="h-5 w-5 shrink-0"
            >
              <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
            </svg>
          }
          {{ item.label }}
        </button>
      }
    </nav>

    <div class="absolute bottom-0 w-full">
      <div class="p-3 bg-gray-200 rounded-2xl mx-auto w-50 mb-3 font-mono">
          <p class="text-sm">Presupuesto mensual</p>
          <div class="flex items-center gap-1 font-bold">
            <span>$</span>
            <input
              type="number"
              class="w-full bg-transparent outline-none"
              [value]="budgetService.monthlyBudget()"
              (change)="onBudgetChange($event)"
              min="0"
              step="0.01"
            />
          </div>
      </div>
      <button
        type="button"
        class="mt-8 mx-auto mb-7 flex w-50 items-center justify-center gap-2 rounded-lg py-2 text-sm font-medium text-gray-600 hover:bg-gray-100"
        (click)="logout()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="h-5 w-5 shrink-0"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H3" />
        </svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Main area -->
  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Topbar -->
    <header class="flex h-20 shrink-0 items-center gap-4 border-b border-gray-200 bg-white px-4 md:px-8">
      <button
        type="button"
        class="rounded-lg p-2 text-gray-600 hover:bg-gray-100 md:hidden"
        (click)="toggleSidebar()"
        aria-label="Abrir menú"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
        </svg>
      </button>
      <div>
        <h1 class="text-2xl font-semibold capitalize text-gray-900">{{ activeSection() }}</h1>
        <p> {{ descriptionSection() }} </p>
      </div>


      <button
        type="button"
        class="ml-auto rounded-lg p-2 text-gray-600 hover:bg-gray-100"
        title="Eliminar todos los gastos"
        aria-label="Eliminar todos los gastos"
        (click)="onDeleteAll()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
      </button>
    </header>

    <!-- Content -->
    <main class="flex-1 overflow-y-auto p-1 md:p-8">
      <div class="flex h-full justify-center rounded-xl text-gray-400">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>

<div class="rounded-2xl border border-gray-200 bg-white p-4">
    @if (transactions().length === 0 && emptyMessage()) {
        <p class="py-4 text-center text-gray-500" role="status">{{ emptyMessage() }}</p>
    } @else {
        @for (transaction of transactions(); track transaction; let last = $last) {
            <app-transaction-item
                [description]="transaction.description"
                [categoryId]="transaction.categoryId"
                [date]="transaction.date"
                [amount]="transaction.amount"
                [colorClass]="transaction.colorClass ?? 'bg-gray-500'"
                [sumRestSign]="transaction.sumRestSign"
                [showDivider]="!last"
            />
        }
    }
</div>

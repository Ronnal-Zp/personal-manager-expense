<div class="grid grid-cols-3 gap-2 w-full mb-6">
    <app-summary-card label="Gastado del mes" [amount]=`$${totalExpense}` />

    <app-summary-card label="Presupuesto total" [amount]="formattedBudget()" />

    <app-summary-card label="Disponible" [amount]="`$${available}`" />
</div>

<h3 class="mb-2 font-bold text-black">Presupuesto por categoría</h3>

@for (category of categories(); track $index) {
  <app-category-progress
    [category]="category.name"
    [colorClass]="category.color ?? ''"
    [textColorClass]="category.text_color ?? ''"
    [current]="getCurrentExpensesByCategory(category.id)"
    [max]="category.budget_Limit ?? 0"
  >
  </app-category-progress>
}

<h3 class="mb-2 font-bold text-black">Transacciones recientes</h3>

<app-recent-transactions [transactions]="transactions()" />

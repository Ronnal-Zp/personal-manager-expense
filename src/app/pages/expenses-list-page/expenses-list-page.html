<div class="flex flex-wrap gap-4 mb-8 w-full" role="group" aria-label="Filtrar por categoría">
    <app-filter-chip
        label="Todas"
        [selected]="selectedFilterId() === allFilterId"
        (filterSelect)="selectFilter(allFilterId)"
    />

    @for (filter of filters(); track filter.id) {
        <app-filter-chip
            [label]="filter.name"
            [selected]="filter.id === selectedFilterId()"
            (filterSelect)="selectFilter(filter.id)"
        />
    }
</div>


@if (loading()) {
    <p class="py-4 text-center text-gray-500" role="status">Cargando gastos...</p>
} @else {
    <app-recent-transactions
        [transactions]="expenses()"
        emptyMessage="No existen gastos asociados a la categoría filtrada"
    />
}

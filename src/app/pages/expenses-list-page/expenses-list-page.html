
<div class="flex gap-4 mb-8 w-full" role="group" aria-label="Filtrar por categoría">
    @for (filter of filters; track filter.label) {
        <app-filter-chip
            [label]="filter.label"
            [selected]="filter.label === selectedFilter()"
            (filterSelect)="selectFilter(filter.label)"
        />
    }
</div>


<app-recent-transactions
    [transactions]="filteredTransactions()"
    emptyMessage="No existen gastos asociados a la categoría filtrada"
/>

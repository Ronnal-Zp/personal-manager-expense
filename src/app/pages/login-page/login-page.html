<div class="w-full max-w-md p-4">
  <div class="rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">
    <div class="mb-8 flex flex-col items-center gap-2">
      <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-indigo-600 text-xl font-semibold text-white">
        $
      </div>
      <h1 class="text-lg font-semibold text-gray-900">Mis Finanzas</h1>
      <p class="text-sm text-gray-500">Inicia sesión para continuar</p>
    </div>

    <form [formGroup]="formLogin" (ngSubmit)="onLogin()" class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <label for="username" class="text-xs font-bold uppercase tracking-wide text-gray-500">Usuario</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          placeholder="Tu usuario"
          class="rounded-2xl border border-gray-200 px-4 py-3 outline-none placeholder:text-gray-300"
        />
        @if (formLogin.get('username')?.invalid && formLogin.get('username')?.touched) {
          <p class="text-sm text-red-500">El usuario es requerido</p>
        }
      </div>

      <div class="flex flex-col gap-2">
        <label for="password" class="text-xs font-bold uppercase tracking-wide text-gray-500">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Tu contraseña"
          class="rounded-2xl border border-gray-200 px-4 py-3 outline-none placeholder:text-gray-300"
        />
        @if (formLogin.get('password')?.invalid && formLogin.get('password')?.touched) {
          <p class="text-sm text-red-500">La contraseña es requerida</p>
        }
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        [class]="loading()
          ? 'bg-gray-300 text-gray-500 cursor-not-allowed font-semibold rounded-2xl py-4 w-full'
          : 'bg-indigo-600 text-white font-semibold rounded-2xl py-4 w-full'"
      >
        {{ loading() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
